[project]
name = "casino-bonus-scraper"
version = "1.0.0"
description = "Casino bonus scraper screening task"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "openai>=1.0.0",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
mypy_path = "src"

[[tool.mypy.overrides]]
# Third-party libraries without type stubs
module = ["openai.*"]
ignore_missing_imports = true